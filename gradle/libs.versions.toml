# Catalogue de versions — vérifié et figé le 2026-10-19 (tâche P0-01) sur les dernières versions stables
# (Maven Central, Gradle Plugin Portal, API Fill v3 de PaperMC). Pas de bêta, RC, milestone ni alpha.

[versions]
java = "25"
paper = "26.1.2.build.74-stable"     # format Paper 26.x : <mc>.build.<n>-stable — dernier build STABLE de 26.1.2
velocity = "4.3.0"                   # dernière Velocity stable (Fill v3), compatible 26.1
hikari = "7.1.0"
flyway = "13.10.3"
postgres = "42.7.14"
lettuce = "7.9.0.RELEASE"            # 8.0 encore en bêta
caffeine = "3.3.1"
gson = "2.14.0"
jspecify = "1.0.1"
junit = "6.1.3"
assertj = "3.27.7"                   # 4.0 encore en milestone
testcontainers = "2.0.5"
dockerjava = "3.7.1"
slf4j = "2.0.20"                     # 2.1 encore en alpha
logback = "1.6.5"
shadow = "9.6.1"
runpaper = "3.1.0"
# Qualité (utilisés par P0-11)
spotless = "8.10.4"
palantir-format = "2.102.0"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
checkstyle = "14.3.0"
archunit = "1.5.1"
jacoco = "0.8.15"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
dockerjava-core = { module = "com.github.docker-java:docker-java-core", version.ref = "dockerjava" }
dockerjava-httpclient5 = { module = "com.github.docker-java:docker-java-transport-httpclient5", version.ref = "dockerjava" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Plugins Gradle utilisés comme dépendances de build-logic (marqueurs de plugin)
shadow-gradle-plugin = { module = "com.gradleup.shadow:com.gradleup.shadow.gradle.plugin", version.ref = "shadow" }
run-paper-gradle-plugin = { module = "xyz.jpenilla.run-paper:xyz.jpenilla.run-paper.gradle.plugin", version.ref = "runpaper" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runpaper" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "runpaper" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
