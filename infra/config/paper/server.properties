# Référence pour les serveurs Paper Nexus (lobby, game, editor) — cf. docs/12-performance.md §4
# server-port et server-ip sont gérés par Pterodactyl (egg) ou docker-compose.
online-mode=false
enforce-secure-profile=false
view-distance=6
simulation-distance=4
network-compression-threshold=-1
sync-chunk-writes=false
spawn-protection=0
allow-nether=false
generate-structures=false
spawn-monsters=false
spawn-animals=false
spawn-npcs=false
max-players=200
allow-flight=true
level-type=minecraft\:flat
motd=Nexus
